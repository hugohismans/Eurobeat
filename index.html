<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05061a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Gravity Drift</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="progress"><div id="hud-progress-bar"></div></div>
          <span id="hud-progress">0 %</span>
          <button id="btn-pause" class="hud-pause" aria-label="Pause">❚❚</button>
        </div>
        <div class="hud-info">
          <span id="hud-section"></span>
          <span id="hud-practice" class="tag hidden">PRACTICE</span>
        </div>
        <div id="hud-combo" class="combo"></div>
        <div id="hud-delta" class="delta"></div>
      </div>

      <section id="menu" class="screen">
        <div class="panel">
          <h1><span class="t1">GRAVITY</span><span class="t2">DRIFT</span></h1>
          <p class="sub">Piste de test · Eurobeat synthétique · 150 BPM</p>
          <div class="row">
            <button id="btn-play" class="btn primary">Jouer</button>
            <button id="btn-practice" class="btn">Practice</button>
          </div>
          <div class="settings">
            <label class="setting">
              <span>Latence</span>
              <span class="stepper">
                <button data-lat="-10" class="btn mini">−</button>
                <output id="latency">0 ms</output>
                <button data-lat="10" class="btn mini">+</button>
              </span>
            </label>
            <label class="setting">
              <span>Flip en l'air (test)</span>
              <input id="opt-airflip" type="checkbox" />
            </label>
          </div>
          <p class="help">Tap · Espace · Clic : inverser la gravité<br />Échap / bouton ❚❚ : pause · H : hitboxes</p>
        </div>
      </section>

      <section id="loading" class="screen hidden"><div class="panel"><p>Chargement…</p></div></section>

      <section id="pause" class="screen hidden">
        <div class="panel">
          <h2>Pause</h2>
          <div class="col">
            <button id="btn-resume" class="btn primary">Reprendre</button>
            <button id="btn-restart" class="btn">Recommencer</button>
            <button id="btn-menu" class="btn">Menu</button>
          </div>
        </div>
      </section>

      <section id="end" class="screen hidden">
        <div class="panel">
          <h2 id="end-title">Crash</h2>
          <div class="stats">
            <div><b id="end-progress">0 %</b><small>progression</small></div>
            <div><b id="end-accuracy">–</b><small>précision</small></div>
            <div><b id="end-combo">0</b><small>combo max</small></div>
          </div>
          <p id="end-detail" class="detail"></p>
          <div class="col">
            <button id="btn-again" class="btn primary">Rejouer</button>
            <button id="btn-switch" class="btn">Mode practice</button>
            <button id="btn-end-menu" class="btn">Menu</button>
          </div>
        </div>
      </section>

      <div id="error" class="error hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
